# Points the cask at Ultrapaint's latest release once it carries the macOS app: every hour, and on
# demand from the Actions tab. It needs nothing of the main repository but its public releases.
name: Follow Ultrapaint's releases

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Point the cask at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo ultrapaint/ultrapaint --json tagName -q .tagName)
          version=${latest#v}
          current=$(sed -nE 's/^  version "(.*)"/\1/p' Casks/ultrapaint.rb)
          if [ "$version" = "$current" ]; then
            echo "already at $version"
            exit 0
          fi
          dmg="ultrapaint-$version-mac-arm64.dmg"
          if ! gh release download "$latest" --repo ultrapaint/ultrapaint --pattern "$dmg" --dir "$RUNNER_TEMP"; then
            echo "$latest has no $dmg yet"
            exit 0
          fi
          sha=$(sha256sum "$RUNNER_TEMP/$dmg" | cut -d' ' -f1)
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/ultrapaint.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ultrapaint $version"
          git push
